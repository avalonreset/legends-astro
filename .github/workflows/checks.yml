name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Release hygiene check
        run: python scripts/check_release.py
      - name: Node source manifest and doctor negative tests
        run: |
          node ./scripts/verify-sources.mjs
          node ./scripts/test-doctor.mjs
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Editable install and offline doctor smoke
        run: |
          python -m pip install --upgrade "pip>=26.2.2"
          python -m pip install -e .
          legends-astro doctor --json
          legends-astro knowledge-pack --check
