name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Release hygiene check
        run: python scripts/check_release.py
      - name: Node source manifest and doctor negative tests
        run: |
          node ./scripts/verify-sources.mjs
          node ./scripts/test-doctor.mjs
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Editable install and offline doctor smoke
        run: |
          python -m pip install -e .
          legends-astro doctor --json
          legends-astro knowledge-pack --check
