[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "legends-astro"
version = "0.3.0"
description = "End-to-end multi-framework (Next.js, Nuxt, Gatsby, Vite/CRA, Docusaurus, Hugo, Jekyll, Eleventy, SvelteKit), WordPress, Webflow, and HTML to Astro v7.4 migration, capture, asset localization, scaffolding, Visual Digital Twin, build parity verification, and curated docs workflows for coding agents."
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Benjamin Samar / cto-legends"}]
dependencies = []
readme = "README.md"

[project.scripts]
legends-astro = "legends_astro.cli:main"

[project.urls]
Homepage = "https://cto-legends.com/modules/legends-astro"
Documentation = "https://cto-legends.com/modules/legends-astro"
Repository = "https://github.com/avalonreset/legends-astro"
Issues = "https://github.com/avalonreset/legends-astro/issues"

[tool.setuptools.packages.find]
include = ["legends_astro*"]
