[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legends-astro"
version = "0.2.0"
description = "Astro v7 readiness, migration contract extraction, build parity verification, and curated documentation workflows for coding agents."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Benjamin Samar / cto-legends"}]
dependencies = []
readme = "README.md"

[project.scripts]
legends-astro = "legends_astro.cli:main"

[project.urls]
Repository = "https://github.com/avalonreset/legends-astro"
Issues = "https://github.com/avalonreset/legends-astro/issues"

[tool.setuptools.packages.find]
include = ["legends_astro*"]
